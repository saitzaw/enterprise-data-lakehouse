[core]
dags_folder = /opt/airflow/dags
base_log_folder = /opt/airflow/logs
base_cachedir = /opt/airflow/.cache

# Database
sql_alchemy_conn = postgresql://airflow:airflowpass@postgres:5432/airflowdb
sql_engine_encoding = utf-8

# Celery with Redis
broker_url = redis://redis:6379/0
celery_result_backend = redis://redis:6379/0

# Task execution
parallelism = 32
max_active_tasks_per_dag = 16
max_active_runs_per_dag = 16
load_examples = False
load_default_connections = False
unit_test_mode = False

# Executor: CeleryExecutor for distributed execution
executor = CeleryExecutor

# Logging
log_level = INFO
fab_logging_level = WARNING

# Security
expose_config = False
hide_sensitive_var_conn_fields = True

[webserver]
expose_config = False
enable_proxy_fix = True
default_ui_timezone = UTC
base_log_folder = /opt/airflow/logs

[scheduler]
dag_dir_list_interval = 300
max_dagruns_to_create_per_loop = 10
max_tis_per_query = 512
catchup_by_default = False

[api]
auth_backends = airflow.api.auth.backend.default

[triggerer]
default_capacity = 1000

[logging]
remote_logging = False

[secrets]
backend = airflow.secrets.environment.EnvironmentVariablesBackend

[core]
# Allow templates to access environment variables
dag_allow_pickle = True
